:root{
  --bg:#F5F4EF;
  --surface:#FFFFFF;
  --surface-2:#FBFAF6;
  --border:#E6E2D8;
  --text:#20302D;
  --text-muted:#6C7975;
  --primary:#0E6E63;
  --primary-2:#12867A;
  --primary-soft:#E3F1EE;
  --on-primary:#FFFFFF;
  --accent:#B8912E;
  --accent-soft:#F5EBD3;
  --success:#2E8B57;
  --success-soft:#E4F3EA;
  --danger:#D9534F;
  --danger-soft:#FBEAE9;
  --warning:#C98A1F;
  --warning-soft:#FBF0DD;
  --shadow:0 2px 14px rgba(30,40,38,.08);
  --radius:16px;
  --radius-sm:10px;
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-total:calc(var(--nav-h) + var(--safe-b));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;
    --surface:#162220;
    --surface-2:#1B2825;
    --border:#28362F;
    --text:#EAF2EF;
    --text-muted:#96A6A0;
    --primary:#33B0A1;
    --primary-2:#3FCBB9;
    --primary-soft:#173330;
    --on-primary:#06201B;
    --accent:#D9B968;
    --accent-soft:#2E2818;
    --success:#4FB37E;
    --success-soft:#173327;
    --danger:#E5837B;
    --danger-soft:#3A1E1D;
    --warning:#E2B15C;
    --warning-soft:#332A17;
    --shadow:0 2px 14px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo','Tajawal',Tahoma,'Segoe UI',Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
  overflow-x:hidden;
  min-height:100vh;
  padding-bottom:calc(var(--nav-total) + 14px);
}
h1,h2,h3,h4{margin:0;font-weight:700;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}
::-webkit-scrollbar{width:0;height:0;}

.app-header{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  max-width:520px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid transparent;
}
.app-header.scrolled{border-bottom-color:var(--border);}
.app-title{display:flex;align-items:center;gap:10px;}
.app-title .logo{
  width:36px;height:36px;border-radius:11px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:var(--on-primary);
  flex-shrink:0;
}
.app-title h1{font-size:18px;}
.header-actions{display:flex;gap:6px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:pointer;flex-shrink:0;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:19px;height:19px;}

main#app{padding:0 16px calc(var(--nav-total) + 30px);max-width:520px;margin:0 auto;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);

.section-title{font-size:16px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn-soft{background:var(--primary-soft);color:var(--primary);}

.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
input[type="date"]{direction:ltr;text-align:right;}

.date-row input{flex:1;min-width:0;}

.field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236C7975' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 12px center;background-size:16px;padding-left:36px;}

  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);

}

.tx-list{display:flex;flex-direction:column;gap:8px;}
.tx-item{

}

  width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;

.tx-body .t1{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;gap:6px;}

.tx-amt{font-weight:800;font-size:14.5px;white-space:nowrap;}
.tx-amt.neg{color:var(--danger);}
.tx-amt.pos{color:var(--success);}
.empty-state{text-align:center;padding:34px 10px;color:var(--text-muted);}

}

.progress{display:flex;height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}

.bottom-nav{

}
.nav-inner{display:flex;width:100%;max-width:520px;}
.nav-btn{

.nav-btn svg{width:21px;height:21px;}
.nav-btn span{font-size:10.5px;font-weight:600;white-space:nowrap;}

}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}

.doc-body{flex:1;min-width:0;}
.doc-body .n{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-body .s{font-size:11.5px;color:var(--text-muted);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .lbl{font-size:14px;}
.toggle-row .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.switch{position:relative;width:46px;height:27px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s;}
.switch .track:before{content:"";position:absolute;width:21px;height:21px;left:22px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--primary);}
.switch input:checked + .track:before{left:3px;}

  position:fixed;bottom:calc(var(--nav-total) + 16px);left:max(18px, calc(50vw - 242px));width:56px;height:56px;border-radius:18px;

function ic(name,size=20){
 const d=ICONS[name]||ICONS.dots;
 return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}

/* ==================== أدوات مساعدة ==================== */
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function currentMonthKey(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
function monthKeyOfDate(dateStr){return dateStr.slice(0,7);}
function addMonthKey(mk,delta){let[y,m]=mk.split('-').map(Number);m+=delta;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad2(m);}
function monthLabel(mk){const[y,m]=mk.split('-').map(Number);return MONTHS_AR[m-1]+' '+y;}
function lastDayOfMonth(mk){const[y,m]=mk.split('-').map(Number);const d=new Date(y,m,0).getDate();return `${y}-${pad2(m)}-${pad2(d)}`;}
function firstDayOfMonth(mk){return mk+'-01';}
function fmtNum(n){n=Math.round((n+Number.EPSILON)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2});}
function fmtMoney(n){const sign=n<0?'-':'';return sign+fmtNum(Math.abs(n))+' '+CURRENCY;}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function qs(sel){return document.querySelector(sel);}
function qsa(sel){return document.querySelectorAll(sel);}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function emptyState(msg){return `<div class="empty-state">${ic('search',36)}<div>${msg}</div></div>`;}

/* حقل تاريخ مع زر "اليوم" لتثبيت التاريخ بضغطة واحدة بدون فتح منتقي النظام */
function dateFieldHtml(label,id,value){
 return `<div class="field"><label>${label}</label><div class="date-row"><input type="date" id="${id}" value="${value}"><button type="button" class="btn btn-soft btn-sm" data-today-for="${id}">اليوم</button></div></div>`;

/* تنسيق الأرقام بفواصل الآلاف أثناء الكتابة، مع الحفاظ على القيمة الرقمية الفعلية عند الحفظ */
function formatThousandsStr(raw){
 let cleaned=String(raw||'').replace(/[^\d.]/g,'');
 const firstDot=cleaned.indexOf('.');
 if(firstDot!==-1) cleaned=cleaned.slice(0,firstDot+1)+cleaned.slice(firstDot+1).replace(/\./g,'');
 let [intPart,decPart]=cleaned.split('.');
 intPart=(intPart||'').replace(/^0+(?=\d)/,'');
 const withCommas=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
 return decPart!=null?withCommas+'.'+decPart.slice(0,2):withCommas;
}
function wireAmountInput(el){
 if(!el||el.dataset.amountWired) return;
 el.dataset.amountWired='1';
 el.type='text'; el.inputMode='decimal';
 if(el.value) el.value=formatThousandsStr(el.value);
 el.addEventListener('input',()=>{ el.value=formatThousandsStr(el.value); });
}
function wireAmountInputs(root){ (root||document).querySelectorAll('[data-amount]').forEach(wireAmountInput); }
function parseAmount(str){ return parseFloat(String(str||'').replace(/,/g,''))||0; }

/* ==================== قاعدة البيانات (IndexedDB) ==================== */
const DB_NAME='mizaniyati_db', DB_VER=1;
let DB;
function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{
   const d=e.target.result;
   if(!d.objectStoreNames.contains('expenses')){const s=d.createObjectStore('expenses',{keyPath:'id',autoIncrement:true});s.createIndex('month','month');s.createIndex('date','date');}
   if(!d.objectStoreNames.contains('income')) d.createObjectStore('income',{keyPath:'month'});
   if(!d.objectStoreNames.contains('reserveTx')){const s=d.createObjectStore('reserveTx',{keyPath:'id',autoIncrement:true});s.createIndex('date','date');}
   if(!d.objectStoreNames.contains('healthTx')){const s=d.createObjectStore('healthTx',{keyPath:'id',autoIncrement:true});s.createIndex('date','date');}
   if(!d.objectStoreNames.contains('homeMeta')) d.createObjectStore('homeMeta',{keyPath:'id'});
   if(!d.objectStoreNames.contains('homePayments')){const s=d.createObjectStore('homePayments',{keyPath:'id',autoIncrement:true});s.createIndex('date','date');}
   if(!d.objectStoreNames.contains('homeDocs')) d.createObjectStore('homeDocs',{keyPath:'id',autoIncrement:true});
   if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
  };
  r.onsuccess=e=>{DB=e.target.result;resolve(DB);};
  r.onerror=e=>reject(e.target.error);
 });
}
function preq(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
function store(name,mode='readonly'){return DB.transaction(name,mode).objectStore(name);}
const DBX={
 all:(s)=>preq(store(s).getAll()),
 get:(s,k)=>preq(store(s).get(k)),
 put:(s,v)=>preq(store(s,'readwrite').put(v)),
 add:(s,v)=>preq(store(s,'readwrite').add(v)),
 del:(s,k)=>preq(store(s,'readwrite').delete(k)),
 byIndex:(s,idx,val)=>preq(store(s).index(idx).getAll(val)),
 clear:(s)=>preq(store(s,'readwrite').clear()),
};
async function getSetting(key,def){const r=await DBX.get('settings',key);return r?r.value:def;}
async function setSetting(key,value){return DBX.put('settings',{key,value});}

async function getExpensesForMonth(mk){return DBX.byIndex('expenses','month',mk);}
async function getAllExpenses(){return DBX.all('expenses');}
async function getIncomeForMonth(mk){const r=await DBX.get('income',mk);return r?r.amount:0;}
async function setIncomeForMonth(mk,amount){return DBX.put('income',{month:mk,amount});}
async function reserveBalance(){const t=await DBX.all('reserveTx');return t.reduce((s,x)=>s+(x.type==='deposit'?x.amount:-x.amount),0);}
async function healthBalance(){const t=await DBX.all('healthTx');return t.reduce((s,x)=>s+(x.type==='withdrawal'?-x.amount:x.amount),0);}

/* إضافة الصندوق الصحي الشهرية التلقائية: تُستدعى عند الإقلاع وأيضًا فور حفظ/تغيير المبلغ الشهري حتى لا تنتظر إعادة تحميل الصفحة */
async function processHealthMonthly(){
 const cmk=currentMonthKey();
 const healthMonthly=await getSetting('healthMonthly',0);
 let lastH=await getSetting('health_lastMonth',null);
 if(healthMonthly<=0) return;
 if(!lastH){
  await DBX.add('healthTx',{type:'auto',amount:healthMonthly,date:todayStr(),note:'إضافة شهرية تلقائية'});
  await setSetting('health_lastMonth',cmk);
 }else{
  let m=lastH;
  while(m<cmk){
   m=addMonthKey(m,1);
   await DBX.add('healthTx',{type:'auto',amount:healthMonthly,date:firstDayOfMonth(m),note:'إضافة شهرية تلقائية'});
   await setSetting('health_lastMonth',m);
  }
 }
}

/* صيانة تلقائية: إضافة الصندوق الصحي الشهرية + ترحيل المتبقي (كلاهما اختياري/مشروط) */
async function runMaintenance(){
 const cmk=currentMonthKey();
 await processHealthMonthly();
 const rolloverOn=await getSetting('rolloverEnabled',false);
 if(rolloverOn){
  let lastR=await getSetting('rollover_lastMonth',null);
  if(!lastR){ await setSetting('rollover_lastMonth',cmk); }
  else{
   let m=lastR;
   while(addMonthKey(m,1)<cmk){
    m=addMonthKey(m,1);
    const inc=await getIncomeForMonth(m);
    if(inc>0){
     const exps=await getExpensesForMonth(m);
     const total=exps.reduce((s,e)=>s+e.amount,0);
     const leftover=inc-total;
     if(leftover>0){
      await DBX.add('reserveTx',{type:'deposit',amount:leftover,date:lastDayOfMonth(m),source:'ترحيل تلقائي',note:'ترحيل المتبقي من شهر '+monthLabel(m)});
     }
    }
    await setSetting('rollover_lastMonth',m);
   }
  }
 }
}

/* ==================== الرسوم البيانية (Canvas) ==================== */
function cssVar(name){return getComputedStyle(document.body).getPropertyValue(name).trim();}
function colorMuted(){return cssVar('--text-muted');}
function colorText(){return cssVar('--text');}
function colorPrimary(){return cssVar('--primary');}
function colorDanger(){return cssVar('--danger');}
function colorAccent(){return cssVar('--accent');}
function colorSurface(){return cssVar('--surface');}

function setupCanvasHiDPI(canvas,cssW,cssH){
 const dpr=window.devicePixelRatio||1;
 canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
 canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
 const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
 return ctx;
}
function roundRectPath(ctx,x,y,w,h,r){
 if(h<=0.5){ctx.beginPath();return;}
 r=Math.max(0,Math.min(r,w/2,h/2));
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}
function drawPie(canvas,data){
 const W=canvas.clientWidth||280,H=220;
 const ctx=setupCanvasHiDPI(canvas,W,H);
 ctx.clearRect(0,0,W,H);
 const total=(data||[]).reduce((a,b)=>a+b.value,0);
 const cx=W/2, cy=H/2, r=Math.min(W,H)/2-8;
 if(total<=0){
  ctx.fillStyle=colorMuted(); ctx.font='13px Cairo'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('لا توجد بيانات لعرضها', cx, cy);
  return;
 }
 let start=-Math.PI/2;
 data.forEach(d=>{
  const ang=d.value/total*Math.PI*2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+ang); ctx.closePath();
  ctx.fillStyle=d.color; ctx.fill();
  start+=ang;
 });
 ctx.beginPath(); ctx.arc(cx,cy,r*0.56,0,Math.PI*2); ctx.fillStyle=colorSurface()||'#fff'; ctx.fill();
 ctx.fillStyle=colorText(); ctx.font='bold 15px Cairo'; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText(fmtNum(total), cx, cy-8);
 ctx.font='11px Cairo'; ctx.fillStyle=colorMuted();
 ctx.fillText('الإجمالي', cx, cy+12);
}
function drawBars(canvas,labels,values,colors){
 const W=canvas.clientWidth||300,H=180;
 const ctx=setupCanvasHiDPI(canvas,W,H);
 ctx.clearRect(0,0,W,H);
 const n=(labels||[]).length;
 if(n===0){ctx.fillStyle=colorMuted();ctx.font='13px Cairo';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('لا توجد بيانات',W/2,H/2);return;}
 const max=Math.max(...values,1);
 const padBottom=26, padTop=12;
 const plotH=H-padBottom-padTop;
 const gap=10;
 const barW=(W-gap*(n+1))/n;
 for(let i=0;i<n;i++){
  const x=gap+i*(barW+gap);
  const h=values[i]/max*plotH;
  const y=padTop+(plotH-h);
  ctx.fillStyle=Array.isArray(colors)?colors[i]:colors;
  roundRectPath(ctx,x,y,barW,h,4);
  ctx.fill();
  ctx.fillStyle=colorMuted(); ctx.font='10.5px Cairo'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(labels[i], x+barW/2, H-8);
 }
}
function drawLineArea(canvas,labels,values,color){
 const W=canvas.clientWidth||300,H=180;
 const ctx=setupCanvasHiDPI(canvas,W,H);
 ctx.clearRect(0,0,W,H);
 const n=(values||[]).length;
 if(n===0){ctx.fillStyle=colorMuted();ctx.font='13px Cairo';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('لا توجد بيانات',W/2,H/2);return;}
 const max=Math.max(...values,1), min=Math.min(...values,0);
 const padTop=14,padBottom=24,padSide=8;
 const plotW=W-padSide*2, plotH=H-padTop-padBottom;
 const xAt=i=>padSide+(n<=1?0:(i/(n-1))*plotW);
 const yAt=v=>padTop+(max===min?plotH/2:(max-v)/(max-min)*plotH);
 ctx.beginPath();
 values.forEach((v,i)=>{const x=xAt(i),y=yAt(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
 ctx.lineTo(xAt(n-1),padTop+plotH); ctx.lineTo(xAt(0),padTop+plotH); ctx.closePath();
 ctx.fillStyle=color+'26'; ctx.fill();
 ctx.beginPath();
 values.forEach((v,i)=>{const x=xAt(i),y=yAt(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
 ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.stroke();
 values.forEach((v,i)=>{const x=xAt(i),y=yAt(v); ctx.beginPath();ctx.arc(x,y,2.6,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();});
 ctx.fillStyle=colorMuted(); ctx.font='10px Cairo'; ctx.textBaseline='alphabetic';
 const step=Math.max(1,Math.ceil(n/6));
 labels.forEach((l,i)=>{
  if(!(i%step===0||i===n-1)) return;
  ctx.textAlign = i===0 ? 'left' : (i===n-1 ? 'right' : 'center');
  ctx.fillText(l, xAt(i), H-6);
 });
}
function drawDualLines(canvas,labels,seriesA,seriesB,colorA,colorB){
 const W=canvas.clientWidth||300,H=190;
 const ctx=setupCanvasHiDPI(canvas,W,H);
 ctx.clearRect(0,0,W,H);
 const n=(labels||[]).length;
 if(n===0){ctx.fillStyle=colorMuted();ctx.font='13px Cairo';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('لا توجد بيانات',W/2,H/2);return;}
 const all=[...seriesA,...seriesB];
 const max=Math.max(...all,1), min=Math.min(...all,0);
 const padTop=14,padBottom=24,padSide=10;
 const plotW=W-padSide*2, plotH=H-padTop-padBottom;
 const xAt=i=>padSide+(n<=1?0:(i/(n-1))*plotW);
 const yAt=v=>padTop+(max===min?plotH/2:(max-v)/(max-min)*plotH);
 function line(vals,color){
  ctx.beginPath();
  vals.forEach((v,i)=>{const x=xAt(i),y=yAt(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.stroke();
  vals.forEach((v,i)=>{const x=xAt(i),y=yAt(v); ctx.beginPath();ctx.arc(x,y,2.4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();});
 }
 line(seriesA,colorA); line(seriesB,colorB);
 ctx.fillStyle=colorMuted(); ctx.font='10px Cairo'; ctx.textBaseline='alphabetic';
 labels.forEach((l,i)=>{
  ctx.textAlign = i===0 ? 'left' : (i===n-1 ? 'right' : 'center');
  ctx.fillText(l, xAt(i), H-8);
 });
}

 </div>

 ${homeMeta && homeMeta.price>0?`

 </div>`:''}

 const catFilter=state.expCatFilter||'all';
 let filtered=exps;
 if(catFilter!=='all') filtered=filtered.filter(e=>e.category===catFilter);
 if(term) filtered=filtered.filter(e=>(e.note||'').includes(term)||catInfo(e.category).label.includes(term)||String(e.amount).includes(term)||e.date.includes(term));

 const total=exps.reduce((s,e)=>s+e.amount,0);

 exps.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+e.amount;});

   <input type="number" data-amount id="incomeInput" value="${income||''}" placeholder="أدخل الدخل الشهري" inputmode="decimal">
  </div>
  <button class="btn btn-soft btn-sm" id="btnSaveIncome" style="width:100%;">${ic('check',15)} حفظ الدخل الشهري</button>
 </div>

function bindExpenses(){
 qs('[data-act="prevMonth"]')?.addEventListener('click',()=>{state.expMonth=addMonthKey(state.expMonth,-1);render();});
 qs('[data-act="nextMonth"]')?.addEventListener('click',()=>{state.expMonth=addMonthKey(state.expMonth,1);render();});
 const incomeEl=document.getElementById('incomeInput');
 if(incomeEl){
  const persistIncome=()=>setIncomeForMonth(state.expMonth, parseAmount(incomeEl.value));
  incomeEl.addEventListener('input', debounce(persistIncome, 500));
  incomeEl.addEventListener('change', async ()=>{ await persistIncome(); render(); });

  });
 }

 const bar=document.getElementById('cmpBar'); if(bar) drawBars(bar, state.chartCache.months.map(m=>MONTHS_EN[Number(m.split('-')[1])-1]), state.chartCache.monthTotals, colorPrimary());
 const searchEl=document.getElementById('expSearchInput');

 document.getElementById('expList')?.addEventListener('click', async (e)=>{
  const item=e.target.closest('.tx-item'); if(!item) return;

function openExpenseForm(existing){
 const isEdit=!!existing;
 const cat=existing?existing.category:CATS[0].id;
 openModal(`
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>${isEdit?'تعديل عملية صرف':'إضافة عملية صرف'}</h3><button class="icon-btn" data-close>${ic('close',18)}</button></div>
  <div class="field"><label>المبلغ</label><input type="number" data-amount id="fAmount" inputmode="decimal" value="${existing?existing.amount:''}" placeholder="0"></div>
  <div class="field"><label>التصنيف</label><select id="fCategory">${CATS.map(c=>`<option value="${c.id}" ${c.id===cat?'selected':''}>${c.label}</option>`).join('')}</select></div>
  ${dateFieldHtml('تاريخ الدفع','fDate', existing?existing.date:todayStr())}
  <div class="field"><label>ملاحظة (تفاصيل المبلغ المصروف)</label><textarea id="fNote">${existing?escapeHtml(existing.note||''):''}</textarea></div>
  <div class="info-banner">${ic('info',16)}<div>أي عملية بتصنيف "دكتور وعلاج" تُخصم تلقائيًا من رصيد الصندوق الصحي وتُسجَّل هناك كذلك، بالإضافة لظهورها ضمن مصروفات الشهر.</div></div>
  <div class="btn-block-row">
   ${isEdit?`<button class="btn btn-danger btn-icon" id="btnDeleteExp">${ic('trash',18)}</button>`:''}
   <button class="btn btn-primary" id="btnSaveExp">${isEdit?'حفظ التعديلات':'إضافة'}</button>
  </div>
 `);
 document.getElementById('btnSaveExp').addEventListener('click', async ()=>{
  const amount=parseAmount(document.getElementById('fAmount').value);
  if(!amount||amount<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
  const category=document.getElementById('fCategory').value;
  const date=document.getElementById('fDate').value||todayStr();
  const note=document.getElementById('fNote').value.trim();
  const rec={amount,category,date,note,month:monthKeyOfDate(date)};

  const wasDoctor=isEdit && existing.category==='doctor';
  const isDoctor=category==='doctor';
  let linkedHealthTxId=isEdit?existing.linkedHealthTxId:undefined;
  if(isDoctor){
   if(linkedHealthTxId){
    const existingHealthTx=await DBX.get('healthTx',linkedHealthTxId);
    await DBX.put('healthTx',{...(existingHealthTx||{}),id:linkedHealthTxId,type:'withdrawal',amount,date,note:'خصم تلقائي - '+(note||'دكتور وعلاج')});
   }else{
    linkedHealthTxId=await DBX.add('healthTx',{type:'withdrawal',amount,date,note:'خصم تلقائي - '+(note||'دكتور وعلاج'),autoFromExpense:true});
   }
   rec.linkedHealthTxId=linkedHealthTxId;
  } else if(wasDoctor && linkedHealthTxId){
   await DBX.del('healthTx',linkedHealthTxId);
  }

  if(isEdit){ rec.id=existing.id; await DBX.put('expenses',rec); toast('تم حفظ التعديلات'); }
  else { await DBX.add('expenses',rec); toast('تمت الإضافة'); }
  state.expMonth=monthKeyOfDate(date);
  closeModal(); render();
 });
 const delBtn=document.getElementById('btnDeleteExp');
 if(delBtn) delBtn.addEventListener('click', async ()=>{
  if(confirm('هل تريد حذف هذه العملية؟')){
   if(existing.linkedHealthTxId) await DBX.del('healthTx',existing.linkedHealthTxId);
   await DBX.del('expenses',existing.id); closeModal(); render(); toast('تم الحذف');
  }
 });
}

/* ==================== مبلغ الاحتياط ==================== */
async function renderReserve(){
 let txs=await DBX.all('reserveTx');
 txs.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const balance=txs.reduce((s,t)=>s+(t.type==='deposit'?t.amount:-t.amount),0);
 const term=(state.reserveSearch||'').trim();
 let filtered=txs;
 if(state.reserveFilter==='deposit') filtered=filtered.filter(t=>t.type==='deposit');
 if(state.reserveFilter==='withdrawal') filtered=filtered.filter(t=>t.type==='withdrawal');
 if(term) filtered=filtered.filter(t=>(t.note||'').includes(term)||(t.source||'').includes(term)||(t.reason||'').includes(term)||String(t.amount).includes(term)||t.date.includes(term));

 const asc=[...txs].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 let running=0; const growthPoints=[];
 asc.forEach(t=>{ running+=t.type==='deposit'?t.amount:-t.amount; growthPoints.push({date:t.date,val:running}); });
 state.chartCache={growthPoints};

 return `
 <div class="card" style="text-align:center;">
  <div class="card-title" style="justify-content:center;">الرصيد الحالي الإجمالي</div>
  <div style="font-size:30px;font-weight:800;color:var(--primary);">${fmtMoney(balance)}</div>
 </div>

 ${growthPoints.length>1?`<div class="card"><div class="card-title">نمو الرصيد عبر الزمن</div><canvas id="reserveGrowth" height="180"></canvas></div>`:''}

 <div class="search-input-wrap">${ic('search',18)}<input type="text" id="reserveSearchInput" placeholder="بحث بالمصدر أو السبب أو المبلغ" value="${escapeHtml(term)}"></div>
 <div class="chip-row">
  <div class="chip ${state.reserveFilter==='all'?'active':''}" data-f="all">الكل</div>
  <div class="chip ${state.reserveFilter==='deposit'?'active':''}" data-f="deposit">إضافات</div>
  <div class="chip ${state.reserveFilter==='withdrawal'?'active':''}" data-f="withdrawal">سحوبات</div>
 </div>

 <div class="section-title">السجل الزمني</div>
 <div class="tx-list" id="reserveList">${filtered.length?filtered.map(reserveRow).join(''):emptyState('لا توجد عمليات')}</div>
 `;
}
function reserveRow(t){
 const isDep=t.type==='deposit';
 return `<div class="tx-item" data-id="${t.id}">
  <div class="tx-icon" style="background:${isDep?'var(--success)':'var(--danger)'}">${ic(isDep?'plus':'trash',18)}</div>
  <div class="tx-body"><div class="t1"><span>${isDep?(t.source||'إضافة'):(t.reason||'سحب')}</span></div><div class="t2">${t.note?escapeHtml(t.note)+' · ':''}${t.date}</div></div>
  <div class="tx-amt ${isDep?'pos':'neg'}">${isDep?'+':'-'}${fmtNum(t.amount)}</div>
 </div>`;
}

function openReserveTxForm(){
 openModal(`
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>عملية جديدة</h3><button class="icon-btn" data-close>${ic('close',18)}</button></div>
  <div class="chip-row" id="rTypeChips"><div class="chip active" data-t="deposit">إضافة (إيداع)</div><div class="chip" data-t="withdrawal">سحب</div></div>
  <div id="rFormBody"></div>
 `);
 let type='deposit';
 renderRForm();
 document.getElementById('rTypeChips').addEventListener('click',(e)=>{
  const c=e.target.closest('.chip'); if(!c) return;
  type=c.dataset.t;
  qsa('#rTypeChips .chip').forEach(x=>x.classList.toggle('active',x===c));
  renderRForm();
 });
 function renderRForm(){
  document.getElementById('rFormBody').innerHTML= type==='deposit'?`
   <div class="field"><label>المبلغ المضاف</label><input type="number" data-amount id="rAmount" inputmode="decimal"></div>
   ${dateFieldHtml('تاريخ الإضافة','rDate',todayStr())}
   <div class="field"><label>المصدر المالي</label><select id="rSource">${RESERVE_SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></div>
   <div class="field"><label>ملاحظة (اختياري)</label><input type="text" id="rNote"></div>
   <button class="btn btn-primary" id="btnSaveR">إضافة</button>
  `:`
   <div class="field"><label>المبلغ المسحوب</label><input type="number" data-amount id="rAmount" inputmode="decimal"></div>
   ${dateFieldHtml('تاريخ السحب','rDate',todayStr())}
   <div class="field"><label>السبب</label><select id="rReason">${RESERVE_REASONS.map(s=>`<option>${s}</option>`).join('')}</select></div>
   <div class="field"><label>تفاصيل إضافية (اختياري)</label><input type="text" id="rNote"></div>
   <button class="btn btn-primary" id="btnSaveR">سحب</button>
  `;
  wireAmountInput(document.getElementById('rAmount'));
  document.getElementById('btnSaveR').addEventListener('click', async ()=>{
   const amount=parseAmount(document.getElementById('rAmount').value);
   if(!amount||amount<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
   const date=document.getElementById('rDate').value||todayStr();
   const note=document.getElementById('rNote').value.trim();
   if(type==='deposit'){
    const source=document.getElementById('rSource').value;
    await DBX.add('reserveTx',{type:'deposit',amount,date,source,note});
   }else{
    const bal=await reserveBalance();
    if(amount>bal && !confirm('المبلغ المسحوب أكبر من الرصيد الحالي. هل تريد المتابعة؟')) return;
    const reason=document.getElementById('rReason').value;
    await DBX.add('reserveTx',{type:'withdrawal',amount,date,reason,note});
   }
   closeModal(); render(); toast('تم الحفظ');
  });
 }
}
function openReserveEditForm(t){
 const isDep=t.type==='deposit';
 openModal(`
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>تعديل ${isDep?'إضافة':'سحب'}</h3><button class="icon-btn" data-close>${ic('close',18)}</button></div>
  <div class="field"><label>المبلغ</label><input type="number" data-amount id="erAmount" value="${t.amount}" inputmode="decimal"></div>
  ${dateFieldHtml('التاريخ','erDate',t.date)}
  ${isDep?`<div class="field"><label>المصدر</label><select id="erSrc">${RESERVE_SOURCES.map(s=>`<option ${s===t.source?'selected':''}>${s}</option>`).join('')}</select></div>`
        :`<div class="field"><label>السبب</label><select id="erSrc">${RESERVE_REASONS.map(s=>`<option ${s===t.reason?'selected':''}>${s}</option>`).join('')}</select></div>`}
  <div class="field"><label>ملاحظة</label><input type="text" id="erNote" value="${escapeHtml(t.note||'')}"></div>
  <div class="btn-block-row">
   <button class="btn btn-danger btn-icon" id="erDel">${ic('trash',18)}</button>
   <button class="btn btn-primary" id="erSave">حفظ</button>
  </div>
 `);
 document.getElementById('erSave').addEventListener('click', async ()=>{
  const amount=parseAmount(document.getElementById('erAmount').value); if(!amount||amount<=0){toast('أدخل مبلغًا صحيحًا');return;}
  const date=document.getElementById('erDate').value||t.date;
  const note=document.getElementById('erNote').value.trim();
  const srcVal=document.getElementById('erSrc').value;
  const rec={...t,amount,date,note};
  if(isDep) rec.source=srcVal; else rec.reason=srcVal;
  await DBX.put('reserveTx',rec);
  closeModal(); render(); toast('تم الحفظ');
 });
 document.getElementById('erDel').addEventListener('click', async ()=>{
  if(confirm('حذف هذه العملية؟')){ await DBX.del('reserveTx',t.id); closeModal(); render(); toast('تم الحذف'); }
 });
}

 const balance=txs.reduce((s,t)=>s+(t.type==='withdrawal'?-t.amount:t.amount),0);
 const term=(state.healthSearch||'').trim();
 let filtered=txs;
 if(state.healthFilter==='deposit') filtered=filtered.filter(t=>t.type!=='withdrawal');
 if(state.healthFilter==='withdrawal') filtered=filtered.filter(t=>t.type==='withdrawal');
 if(term) filtered=filtered.filter(t=>(t.note||'').includes(term)||String(t.amount).includes(term)||t.date.includes(term));

 const asc=[...txs].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 let running=0; const growthPoints=[];
 asc.forEach(t=>{ running+=t.type==='withdrawal'?-t.amount:t.amount; growthPoints.push({date:t.date,val:running}); });
 state.chartCache={growthPoints};

 return `
 <div class="info-banner">${ic('info',16)}<div>الصندوق الصحي مخصص لتجميع مبلغ شهري ثابت كاحتياط للحالات الطبية، ولا يُصفَّر أبدًا بين الأشهر. أي عملية تُسجَّل بتصنيف "دكتور وعلاج" ضمن المصروفات الشهرية تُخصم تلقائيًا من هذا الرصيد وتظهر بالسجل أدناه.</div></div>

   <label>المبلغ الشهري الثابت المخصص للصندوق</label>
   <input type="number" data-amount id="healthMonthlyInput" value="${monthly||''}" inputmode="decimal" placeholder="مثال: 50000">

  <button class="btn btn-soft btn-sm" id="btnSaveHealthMonthly" style="width:100%;">${ic('check',15)} حفظ المبلغ الشهري</button>

 <div class="search-input-wrap">${ic('search',18)}<input type="text" id="healthSearchInput" placeholder="بحث في السجل" value="${escapeHtml(term)}"></div>
 <div class="chip-row">
  <div class="chip ${state.healthFilter==='all'?'active':''}" data-f="all">الكل</div>

 </div>

 <div class="section-title">السجل</div>
 <div class="tx-list" id="healthList">${filtered.length?filtered.map(healthRow).join(''):emptyState('لا توجد عمليات')}</div>
 `;
}
function healthRow(t){
 const isW=t.type==='withdrawal';
 const isAuto=t.type==='auto';
 const isLinked=!!t.autoFromExpense || !!t.linkedExpenseId;
 let label;
 if(isAuto) label='إضافة شهرية تلقائية';
 else if(t.type==='deposit') label='إضافة يدوية';
 else label=isLinked?'خصم (دكتور وعلاج)':'سحب';
 const badgeClass=(!isW)?'auto':(isLinked?'auto':'manual');
 const badgeText=isAuto?'تلقائي':(isW?(isLinked?'مرتبط بمصروف':'يدوي'):'يدوي');
 return `<div class="tx-item" data-id="${t.id}">
  <div class="tx-icon" style="background:${isW?'var(--danger)':'var(--primary)'}">${ic(isW?(isLinked?'stethoscope':'trash'):'plus',18)}</div>
  <div class="tx-body"><div class="t1"><span>${label} <span class="badge ${badgeClass}">${badgeText}</span></span></div><div class="t2">${t.note?escapeHtml(t.note)+' · ':''}${t.date}</div></div>
  <div class="tx-amt ${isW?'neg':'pos'}">${isW?'-':'+'}${fmtNum(t.amount)}</div>
 </div>`;
}

async function renderHomeLoan(){

 let periodExpenses=[], periodIncome=0, periodLabel='';
 if(a.mode==='month'){
  periodExpenses=allExpenses.filter(e=>e.month===a.month);
  periodIncome=incomeMap[a.month]||0;
  periodLabel=monthLabel(a.month);
 }else if(a.mode==='year'){
  periodExpenses=allExpenses.filter(e=>e.month.startsWith(String(a.year)));
  periodIncome=Object.keys(incomeMap).filter(m=>m.startsWith(String(a.year))).reduce((s,m)=>s+incomeMap[m],0);
  periodLabel='سنة '+a.year;
 }else{
  const from=a.from||'0000-01-01', to=a.to||'9999-12-31';
  periodExpenses=allExpenses.filter(e=>e.date>=from && e.date<=to);
  periodIncome=null;
  periodLabel=(a.from&&a.to)?(a.from+' → '+a.to):'اختر نطاق التاريخ أعلاه';
 }
 const periodTotal=periodExpenses.reduce((s,e)=>s+e.amount,0);
 const periodRemaining=periodIncome==null?null:periodIncome-periodTotal;
 const savingsRate=(periodIncome && periodIncome>0)?(periodRemaining/periodIncome*100):null;

 const rBal=await reserveBalance();
 const hBal=await healthBalance();
 const homeMeta=await DBX.get('homeMeta','meta');
 let payoffPct=0;
 if(homeMeta && homeMeta.price>0){ const pays=await DBX.all('homePayments'); payoffPct=Math.min(100,(pays.reduce((s,p)=>s+p.amount,0)/homeMeta.price*100)); }

 const byCat={}; periodExpenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
 const catData=CATS.map(c=>({label:c.label,value:byCat[c.id]||0,color:c.color})).filter(d=>d.value>0);

 const months12=[]; for(let i=11;i>=0;i--) months12.push(addMonthKey(currentMonthKey(),-i));
 const incSeries=months12.map(m=>incomeMap[m]||0);
 const expSeries=months12.map(m=>allExpenses.filter(e=>e.month===m).reduce((s,e)=>s+e.amount,0));
 const monthLabelsShort=months12.map(m=>MONTHS_EN[Number(m.split('-')[1])-1]);

 let weekLabels=[], weekValues=[];
 if(a.mode==='month'){
  const [y,mm]=a.month.split('-').map(Number);
  const dim=new Date(y,mm,0).getDate();
  const weeks=[[1,7],[8,14],[15,21],[22,28],[29,dim]].filter(w=>w[0]<=dim);
  weeks.forEach((w,i)=>{
   const from=`${a.month}-${pad2(w[0])}`, to=`${a.month}-${pad2(w[1])}`;
   const sum=periodExpenses.filter(e=>e.date>=from && e.date<=to && e.category!=='fixed').reduce((s,e)=>s+e.amount,0);
   weekLabels.push('أسبوع '+(i+1)); weekValues.push(sum);
  });
 }

 const rTxs=await DBX.all('reserveTx'), hTxs=await DBX.all('healthTx');
 function cumulativeByMonth(txs,sign){
  const asc=[...txs].sort((x,y)=>x.date.localeCompare(y.date));

 }

 let rRun=0,hRun=0;
 const rSeries=months12.map(m=>{ if(rMap[m]!=null) rRun=rMap[m]; return rRun; });
 const hSeries=months12.map(m=>{ if(hMap[m]!=null) hRun=hMap[m]; return hRun; });

 const years=[...new Set([...allExpenses.map(e=>e.month.slice(0,4)), ...Object.keys(incomeMap).map(m=>m.slice(0,4))])].sort();
 const yoy=years.map(y=>{
  const inc=Object.keys(incomeMap).filter(m=>m.startsWith(y)).reduce((s,m)=>s+incomeMap[m],0);
  const exp=allExpenses.filter(e=>e.month.startsWith(y)).reduce((s,e)=>s+e.amount,0);
  return {y,inc,exp,save:inc-exp};
 });

 state.chartCache={catData,monthLabelsShort,incSeries,expSeries,weekLabels,weekValues,rSeries,hSeries,periodTotal,periodLabel,periodIncome,periodTotal2:periodTotal,yoy};

 return `

 <div class="kpi-grid">

 <div class="legend">${catData.map(d=>`<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span><b>${d.label}</b> ${periodTotal>0?((d.value/periodTotal)*100).toFixed(0):0}% · ${fmtNum(d.value)}</div>`).join('')}</div></div>`:''}

async function runGlobalSearch(term){
 const box=document.getElementById('globalSearchResults');
 if(!term){ box.innerHTML=''; return; }
 const [exps,rtx,htx,pays]=await Promise.all([DBX.all('expenses'),DBX.all('reserveTx'),DBX.all('healthTx'),DBX.all('homePayments')]);
 const match=s=>(s==null?'':String(s)).includes(term);
 const results=[];
 exps.forEach(e=>{ const cat=catInfo(e.category); if(match(e.note)||match(cat.label)||match(e.amount)||match(e.date)) results.push({kind:'مصروف',label:cat.label,amount:-e.amount,date:e.date,note:e.note}); });
 rtx.forEach(t=>{ if(match(t.note)||match(t.source)||match(t.reason)||match(t.amount)||match(t.date)) results.push({kind:'احتياط',label:t.type==='deposit'?(t.source||'إضافة'):(t.reason||'سحب'),amount:t.type==='deposit'?t.amount:-t.amount,date:t.date,note:t.note}); });
 htx.forEach(t=>{ if(match(t.note)||match(t.amount)||match(t.date)) results.push({kind:'صندوق صحي',label:t.type==='withdrawal'?'سحب':'إضافة تلقائية',amount:t.type==='withdrawal'?-t.amount:t.amount,date:t.date,note:t.note}); });
 pays.forEach(p=>{ if(match(p.note)||match(p.amount)||match(p.date)) results.push({kind:'قسط بيت',label:'دفعة',amount:-p.amount,date:p.date,note:p.note}); });
 results.sort((a,b)=>b.date.localeCompare(a.date));
 box.innerHTML=results.length?`<div class="tx-list">${results.map(r=>`
  <div class="tx-item">
   <div class="tx-icon" style="background:var(--text-muted)">${ic('search',16)}</div>
   <div class="tx-body"><div class="t1"><span>${r.kind} · ${r.label}</span></div><div class="t2">${r.note?escapeHtml(r.note)+' · ':''}${r.date}</div></div>
   <div class="tx-amt ${r.amount>=0?'pos':'neg'}">${r.amount>=0?'+':''}${fmtNum(r.amount)}</div>
  </div>`).join('')}</div>`:emptyState('لا توجد نتائج');
}

async function importBackupFile(e){
 const file=e.target.files[0]; if(!file) return;
 if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. هل تريد المتابعة؟')){ e.target.value=''; return; }
 try{
  const text=await file.text();
  const parsed=JSON.parse(text);
  const data=parsed.data||parsed;
  const stores=['expenses','income','reserveTx','healthTx','homeMeta','homePayments','settings','homeDocs'];
  for(const s of stores) await DBX.clear(s);
  for(const s of ['expenses','income','reserveTx','healthTx','homeMeta','homePayments','settings']){
   if(data[s]) for(const rec of data[s]) await DBX.put(s,rec);
  }
  if(data.homeDocs){
   for(const d of data.homeDocs){
    const blob=d.blobBase64?await base64ToBlob(d.blobBase64):null;
    await DBX.put('homeDocs',{id:d.id,name:d.name,mime:d.mime,size:d.size,uploadedAt:d.uploadedAt,blob});
   }
  }
  CURRENCY=await getSetting('currency','د.ع');
  toast('تم استيراد النسخة الاحتياطية بنجاح');
  closeModal();
  navigate(state.view);
 }catch(err){
  toast('تعذر قراءة الملف، تأكد أنه نسخة احتياطية صحيحة');
 }
}

/* ==================== كاتب XLSX بسيط بدون مكتبات خارجية ==================== */
let CRC_TABLE=null;
function getCrcTable(){
 if(CRC_TABLE) return CRC_TABLE;
 CRC_TABLE=new Uint32Array(256);
 for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } CRC_TABLE[n]=c>>>0; }
 return CRC_TABLE;
}
function crc32(bytes){
 const table=getCrcTable(); let c=0xFFFFFFFF;
 for(let i=0;i<bytes.length;i++){ c=table[(c^bytes[i])&0xFF]^(c>>>8); }
 return (c^0xFFFFFFFF)>>>0;
}
function makeByteWriter(){
 const arr=[];
 return {
  u16(v){ arr.push(v&0xFF,(v>>8)&0xFF); },
  u32(v){ arr.push(v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF); },
  bytes(b){ for(let i=0;i<b.length;i++) arr.push(b[i]); },
  toUint8Array(){ return new Uint8Array(arr); },
 };
}
function makeZipBlob(files){
 const encoder=new TextEncoder();
 const localParts=[], centralParts=[];
 let offset=0;
 files.forEach(f=>{
  const nameBytes=encoder.encode(f.name);
  const data=f.data;
  const crc=crc32(data);
  const w=makeByteWriter();
  w.u32(0x04034b50); w.u16(20); w.u16(0); w.u16(0); w.u16(0); w.u16(0);
  w.u32(crc); w.u32(data.length); w.u32(data.length);
  w.u16(nameBytes.length); w.u16(0); w.bytes(nameBytes);
  const localHeader=w.toUint8Array();
  localParts.push(localHeader, data);
  const localOffset=offset;
  offset+=localHeader.length+data.length;

  const cw=makeByteWriter();
  cw.u32(0x02014b50); cw.u16(20); cw.u16(20); cw.u16(0); cw.u16(0); cw.u16(0); cw.u16(0);
  cw.u32(crc); cw.u32(data.length); cw.u32(data.length);
  cw.u16(nameBytes.length); cw.u16(0); cw.u16(0); cw.u16(0); cw.u16(0); cw.u32(0);
  cw.u32(localOffset); cw.bytes(nameBytes);
  centralParts.push(cw.toUint8Array());
 });
 const centralStart=offset;
 let centralSize=0; centralParts.forEach(p=>{ centralSize+=p.length; });
 const end=makeByteWriter();
 end.u32(0x06054b50); end.u16(0); end.u16(0); end.u16(files.length); end.u16(files.length);
 end.u32(centralSize); end.u32(centralStart); end.u16(0);
 return new Blob([...localParts, ...centralParts, end.toUint8Array()], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colLetter(n){ let s=''; while(n>0){ const rem=(n-1)%26; s=String.fromCharCode(65+rem)+s; n=Math.floor((n-1)/26); } return s; }
function xmlEscape(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function cellXml(r,c,value){
 const ref=colLetter(c)+r;
 if(typeof value==='number' && isFinite(value)) return `<c r="${ref}"><v>${value}</v></c>`;
 return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
}
function sheetXml(rows){
 let body='';
 rows.forEach((row,i)=>{ const r=i+1; let rowXml=''; row.forEach((val,j)=>{ rowXml+=cellXml(r,j+1,val); }); body+=`<row r="${r}">${rowXml}</row>`; });
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetData>${body}</sheetData></worksheet>`;
}
function buildWorkbookXlsxBlob(sheets){
 const encoder=new TextEncoder();
 const files=[];
 const overrides=sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
 files.push({name:'[Content_Types].xml', data:encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrides}</Types>`)});
 files.push({name:'_rels/.rels', data:encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)});
 const sheetTags=sheets.map((s,i)=>`<sheet name="${xmlEscape(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('');
 files.push({name:'xl/workbook.xml', data:encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetTags}</sheets></workbook>`)});
 const wbRels=sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('');
 files.push({name:'xl/_rels/workbook.xml.rels', data:encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels}</Relationships>`)});
 sheets.forEach((s,i)=>{ files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:encoder.encode(sheetXml(s.rows))}); });
 return makeZipBlob(files);
}
async function exportExcelReport(){
 const [expenses,incomeRows,reserveTx,healthTx,homePayments,homeMeta]=await Promise.all([
  DBX.all('expenses'), DBX.all('income'), DBX.all('reserveTx'), DBX.all('healthTx'), DBX.all('homePayments'), DBX.get('homeMeta','meta')
 ]);
 expenses.sort((a,b)=>a.date.localeCompare(b.date));
 incomeRows.sort((a,b)=>a.month.localeCompare(b.month));
 reserveTx.sort((a,b)=>a.date.localeCompare(b.date));
 healthTx.sort((a,b)=>a.date.localeCompare(b.date));
 homePayments.sort((a,b)=>a.date.localeCompare(b.date));

 const mk=currentMonthKey();
 const curIncome=(incomeRows.find(r=>r.month===mk)||{}).amount||0;
 const curExpenseTotal=expenses.filter(e=>e.month===mk).reduce((s,e)=>s+e.amount,0);
 const rBal=reserveTx.reduce((s,t)=>s+(t.type==='deposit'?t.amount:-t.amount),0);
 const hBal=healthTx.reduce((s,t)=>s+(t.type==='withdrawal'?-t.amount:t.amount),0);
 const homePaid=homePayments.reduce((s,p)=>s+p.amount,0);

 const summaryRows=[
  ['تقرير ميزانيتي',''],
  ['تاريخ التصدير', new Date().toLocaleString('en-GB')],
  ['الشهر الحالي', monthLabel(mk)],
  ['',''],
  ['الدخل الشهري (الشهر الحالي)', curIncome],
  ['إجمالي مصروف الشهر الحالي', curExpenseTotal],
  ['المتبقي لهذا الشهر', curIncome-curExpenseTotal],
  ['رصيد الاحتياط الإجمالي', rBal],
  ['رصيد الصندوق الصحي', hBal],
  ['إجمالي المسدد من البيت', homePaid],
  ['سعر البيت الكلي', homeMeta?homeMeta.price||0:0],
  ['المتبقي من سعر البيت', homeMeta?Math.max(0,(homeMeta.price||0)-homePaid):0],
 ];
 const expenseRows=[['التاريخ','المبلغ','التصنيف','ملاحظة'], ...expenses.map(e=>[e.date,e.amount,catInfo(e.category).label,e.note||''])];
 const incomeSheetRows=[['الشهر','الدخل'], ...incomeRows.map(r=>[r.month,r.amount])];
 const reserveRows=[['التاريخ','النوع','المبلغ','المصدر / السبب','ملاحظة'], ...reserveTx.map(t=>[t.date,t.type==='deposit'?'إضافة':'سحب',t.amount,t.type==='deposit'?(t.source||''):(t.reason||''),t.note||''])];
 const healthRows=[['التاريخ','النوع','المبلغ','ملاحظة'], ...healthTx.map(t=>[t.date,t.type==='withdrawal'?(t.autoFromExpense?'خصم من دكتور وعلاج':'سحب'):'إضافة شهرية تلقائية',t.amount,t.note||''])];
 const homeRows=[['التاريخ','المبلغ','ملاحظة'], ...homePayments.map(p=>[p.date,p.amount,p.note||''])];

 const blob=buildWorkbookXlsxBlob([
  {name:'ملخص', rows:summaryRows},

 ]);

 const a=document.createElement('a'); a.href=url; a.download='ميزانيتي-تقرير-'+todayStr()+'.xlsx'; document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
 toast('تم تصدير تقرير Excel');
}

/* ==================== قفل PIN عند بدء التشغيل ==================== */
async function checkLock(){
 const enabled=await getSetting('pinEnabled',false);
 const el=document.getElementById('lockScreen');
 if(!enabled){ el.style.display='none'; return; }
 return new Promise(resolve=>{
  showLockScreen(resolve);
 });
}
function showLockScreen(onUnlock){
 const el=document.getElementById('lockScreen');
 el.style.display='flex';
 let entered='';
 el.innerHTML=`
  <div class="logo" style="width:56px;height:56px;border-radius:18px;color:var(--on-primary);background:var(--primary);display:flex;align-items:center;justify-content:center;">${ic('lock',26)}</div>
  <h2>أدخل رمز القفل</h2>
  <div class="lock-dots" id="lockDots">${[0,1,2,3].map(()=>'<div class="lock-dot"></div>').join('')}</div>
  <div class="keypad" id="keypad">
   ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
   <button class="ghost"></button>
   <button data-n="0">0</button>
   <button data-n="back">⌫</button>
  </div>
 `;
 const dotsEls=()=>el.querySelectorAll('.lock-dot');
 el.querySelector('#keypad').addEventListener('click', async (e)=>{
  const btn=e.target.closest('button'); if(!btn||btn.dataset.n==null) return;
  const n=btn.dataset.n;
  if(n==='back'){ entered=entered.slice(0,-1); }
  else if(entered.length<4){ entered+=n; }
  dotsEls().forEach((d,i)=>d.classList.toggle('filled', i<entered.length));
  if(entered.length===4){
   const real=await getSetting('pin','0000');
   if(entered===real){ el.style.display='none'; onUnlock(); }
   else{
    dotsEls().forEach(d=>d.classList.add('shake'));
    setTimeout(()=>{ entered=''; dotsEls().forEach(d=>{d.classList.remove('filled');d.classList.remove('shake');}); },380);
   }
  }
 });
}

/* ==================== الإقلاع ==================== */
function injectStaticIcons(){
 document.getElementById('logoIcon').innerHTML=ic('money',20);
 document.getElementById('btnSearch').innerHTML=ic('search',19);
 document.getElementById('btnSettings').innerHTML=ic('settings',19);
 document.getElementById('fabAdd').innerHTML=ic('plus',24);
 const navIcons={home:'home',expenses:'expenses',reserve:'reserve',health:'health',home_loan:'house',analytics:'analytics'};
 qsa('.nav-btn').forEach(btn=>{ btn.querySelector('.ic').innerHTML=ic(navIcons[btn.dataset.view],21); });
}
function wireNav(){
 qsa('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.view)));
 document.getElementById('btnSearch').addEventListener('click', openSearch);
 document.getElementById('btnSettings').addEventListener('click', openSettings);
 document.body.addEventListener('click',(e)=>{
  const b=e.target.closest('[data-today-for]'); if(!b) return;
  const el=document.getElementById(b.dataset.todayFor);
  if(el) el.value=todayStr();
 });
 document.getElementById('fabAdd').addEventListener('click',()=>{
  if(state.view==='expenses') openExpenseForm();
  else if(state.view==='reserve') openReserveTxForm();
  else if(state.view==='health') openHealthTxForm();
  else if(state.view==='home_loan') openHomePaymentForm();
 });
}
async function boot(){
 await openDB();
 CURRENCY=await getSetting('currency','د.ع');
 await loadCategories();
 injectStaticIcons();
 wireNav();
 await runMaintenance();
 await checkLock();
 await navigate('home');
 if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
 }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
